name: Lightweight CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax-and-lidar-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/lidar/requirements.txt

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/lidar/requirements.txt pytest

      - name: Compile Python sources
        run: python -m compileall -q main.py code capture postprocess shared tools tests

      - name: Run LiDAR helper regression tests
        run: python -m pytest -q tools/lidar/tests

      - name: Reject credentials in shared controller config
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path("config.yaml").read_text(encoding="utf-8")
          forbidden = ("rtk_ntrip_username:", "rtk_ntrip_password:")
          leaked = [key for key in forbidden if key in text]
          if leaked:
              raise SystemExit("shared config contains NTRIP credential keys: " + ", ".join(leaked))
          PY


  component-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical and camera test dependencies without Torch
        run: python -m pip install -r postprocess/requirements.lock depthai==3.1.0 pyserial==3.5 pytest
      - name: Verify component boundaries and existing regressions
        env:
          PYTHONPATH: code
        run: python -m pytest -q tests code/tests
