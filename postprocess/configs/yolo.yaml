# YOLO segmentation, Depth 대표점 생성, 자동 선형화 설정입니다.
dataset: /srv/geonova/processed/REPLACE_RUN_ID/synced        # 필수: timestamps.csv가 있는 동기 데이터셋
model: /srv/geonova/models/guardrail.pt         # 서버에서 별도로 관리하는 segmentation 모델
output_dir: null                          # null saves to <dataset>/yolo_seg
start_frame: 200                       # 카메라 안정화 이후 시작 프레임. 200 이상 필수
max_frames: 999999                     # stride 적용 후 최대 처리 프레임 수. 큰 값=끝까지
stride: 1                              # 1=모든 프레임, 2=두 프레임마다 한 장 처리
confidence: 0.25                       # YOLO 검출 confidence 하한(0~1)
batch_size: 4                          # 추론 batch 크기. GPU 메모리 부족 시 감소
image_size: 1280                       # YOLO 추론 입력 크기(px)
device: "0"                            # "0"=첫 GPU, "cpu"=CPU, "mps"=Apple GPU

# 마스크 내부 Depth fragment 대표점 품질 조건
max_depth_mm: 8000                     # 지도 관측점으로 사용할 최대 거리(mm)
fragment_min_samples: 20              # 마스크 안의 최소 유효 Depth 픽셀 수
fragment_erosion_px: 2                # 배경 혼입을 줄이는 마스크 경계 erosion 반경(px)
depth_confidence_max: 200             # DepthAI confidence 허용 상한. 낮을수록 신뢰도 높음
# Orientation: packaged defaults < merged dataset metadata < explicit --config values < CLI flags.
orientation_source: gps-course        # GPS yaw and OAK IMU tilt
trusted_max_hdop: 2.0
trajectory_max_hdop: 2.5
imu_max_delta_ms: 20.0
imu_to_camera_rpy_deg: [0.0, 0.0, 0.0] # Native RDF camera fallback rotation
imu_to_camera_validated: false        # Enable fallback only after physical validation; CLI 0/1
imu_max_gap_ms: 100.0                 # Reset filter after either sensor has an outage
imu_accel_innovation_deg: 7.0         # Cumulative bound against gyro-only gravity after initial still period
imu_still_duration_s: 0.5             # Required still period before raw tilt becomes trusted
imu_still_accel_tolerance_m_s2: 0.08   # Startup |a|-g tolerance, separate from correction rejection
imu_filter_time_constant_s: 1.0
imu_accel_rejection_m_s2: 1.5          # Correction reaches zero at this |a|-g error
imu_bias_window_s: 2.0                # Initial gyro-bias window; zero disables bias estimation
imu_bias_accel_tolerance_m_s2: 0.2
imu_bias_gyro_threshold_rad_s: 0.05

# YOLO 완료 후 선형화 자동 실행
no_linearize: false                   # true이면 points.csv까지만 만들고 선형화 생략
# Automatic linearization uses all defaults from linearization.yaml.

depth_radius: 5
classes: null
