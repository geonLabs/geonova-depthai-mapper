# YOLO segmentation, Depth 대표점 생성, 자동 선형화 설정입니다.
dataset: image_records/<timestamp>_raw  # 필수: timestamps.csv가 있는 동기 데이터셋
model: best.pt                         # Ultralytics segmentation 모델(.pt) 경로
output_dir: null                       # null이면 <dataset>/yolo_seg에 저장
start_frame: 200                       # 카메라 안정화 이후 시작 프레임. 200 이상 필수
max_frames: 999999                     # stride 적용 후 최대 처리 프레임 수. 큰 값=끝까지
stride: 1                              # 1=모든 프레임, 2=두 프레임마다 한 장 처리
confidence: 0.25                       # YOLO 검출 confidence 하한(0~1)
batch_size: 4                          # 추론 batch 크기. GPU 메모리 부족 시 감소
image_size: 1280                       # YOLO 추론 입력 크기(px)
device: "0"                            # "0"=첫 GPU, "cpu"=CPU, "mps"=Apple GPU

# 마스크 내부 Depth fragment 대표점 품질 조건
max_depth_mm: 8000                     # 지도 관측점으로 사용할 최대 거리(mm)
fragment_min_samples: 20              # 마스크 안의 최소 유효 Depth 픽셀 수
fragment_erosion_px: 2                # 배경 혼입을 줄이는 마스크 경계 erosion 반경(px)
depth_confidence_max: 200             # DepthAI confidence 허용 상한. 낮을수록 신뢰도 높음
orientation_source: ebimu             # ebimu=운영 권장, gps-course(-level)=진행방향 근사

# YOLO 완료 후 선형화 자동 실행
no_linearize: false                   # true이면 points.csv까지만 만들고 선형화 생략
linearization_depth_sample_min: 20    # 선형화에 넘길 최소 Depth 샘플 수
max_gap_connect_m: 6.0                # 대표점 사이 연결 최대 거리(m)
max_heading_deg: 35.0                 # GPS 접선과 연결선 사이 최대 허용 각도(도)
min_line_support: 5                   # 선 하나를 만들 최소 검출 개수
