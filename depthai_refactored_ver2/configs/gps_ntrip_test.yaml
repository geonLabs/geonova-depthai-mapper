# GPS NMEA 수신과 NTRIP/RTCM 보정 링크를 카메라 없이 검사하는 설정입니다.
gps_device: /dev/ttyACM0  # Linux GPS 포트. Windows에서는 예: COM3으로 변경
gps_baudrate: 921600      # GPS 수신기 직렬 통신 속도
duration_s: 30.0          # 테스트를 수행할 시간(초)
no_ntrip: false           # true이면 NTRIP 연결 없이 GPS NMEA 수신만 검사
print_raw: false          # true이면 수신한 원시 NMEA 문장을 모두 출력
# rtk_ntrip_host/port/mountpoint/username/password를 비공개 YAML에 추가할 수 있습니다.
# 비밀번호가 포함된 YAML은 Git에 커밋하지 마세요.
