# Jetson Controller folder-mode capture configuration.
# Missing keys retain the recorder defaults. Runtime result paths are forced to
# JETSON_PIPELINE_RESULTS_DIR by main.py when the Controller launches this job.
output_dir: results
fps: 15.0
depth_fps: 15.0
rgb_width: 1920
rgb_height: 1200
max_runtime_s: 0.0
monitor_only: false

controller_bridge_enabled: true
controller_bridge_dir: results/controller-bridge
controller_status_interval_s: 1.0
controller_sensor_stale_after_s: 3.0
controller_preview_fps: 15.0
controller_preview_max_width: 1920
controller_preview_jpeg_quality: 78

depth_alignment_mode: auto
depth_preset: FAST_DENSITY     # 노면처럼 무늬가 약한 면의 깊이 밀도 우선(3.1.0: confidence 15, LR 10). 이전 값 FAST_ACCURACY
lr_check: true
subpixel: true
subpixel_fractional_bits: 5
stereo_median_filter: "off"
stereo_confidence_threshold: -1    # -1=프리셋 값. DepthAI v3는 값이 낮을수록 더 많은 픽셀을 남김
stereo_lr_check_threshold: -1      # -1=프리셋 값
stereo_speckle_filter: false       # 켜기 전 30초 시험 녹화로 depth 15 FPS 유지 확인
stereo_speckle_range: 50
stereo_speckle_difference_threshold: 2
stereo_spatial_filter: false       # 가로 방향 작은 구멍 메움. 켜기 전 FPS 확인
stereo_spatial_hole_filling_radius: 2
stereo_spatial_alpha: 0.5
stereo_spatial_delta: 0            # 0=자동(정수 시차 3단계)
stereo_spatial_iterations: 1
stereo_postprocessing_shaves: 0    # 0=DepthAI 기본. 필터를 켠 뒤 FPS가 떨어지면 3/3
stereo_postprocessing_memory_slices: 0
stereo_ae_max_exposure_us: 0       # 0=기본(최대 약 프레임 시간). 흐린 날 주행이면 2000
stereo_ae_region: ""               # 저장 영상 기준 x0,y0,x1,y1(0~1). 비우면 화면 전체로 노출 측정
imu_rate: 200                  # Requested OAK IMU rate; monitor mode clamps to 100 Hz
imu_batch: 10
save_confidence_map: false
rotate_180: false

enable_gps: true
gps_device: auto              # u-blox /dev/serial/by-id identity를 자동 선택; ttyACM 번호는 사용하지 않음
rtk_ntrip_auto_mountpoint: true
rtk_ntrip_mountpoint_format: RTCM31
rtk_ntrip_position_wait_s: 10.0
rtk_ntrip_data_timeout_s: 15.0
rtk_ntrip_max_mountpoints: 12
rtk_ntrip_reselect_interval_s: 300.0       # 5분마다 현재 위치 기준으로 더 가까운 기준국 확인
rtk_ntrip_switch_min_improvement_m: 1000.0 # 최소 1km 이상 가까워질 때만 무중단 전환
rtk_ntrip_position_max_age_s: 30.0         # 30초 넘게 갱신되지 않은 좌표로는 기준국을 전환하지 않음
# NTRIP_USERNAME과 NTRIP_PASSWORD는 공유 YAML이 아니라 Controller 보호 환경변수로 주입합니다.
