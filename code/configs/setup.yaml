# 가상환경/패키지 설치 설정입니다. 생략한 키는 setup_env.py 기본값을 사용합니다.
venv: .venv          # 루트 install 스크립트는 저장소 루트의 .venv로 덮어씁니다.
python: auto         # Jetson=JetPack Python, Ubuntu/Windows=uv Python 3.11
platform: auto       # auto, desktop, jetson
cuda: auto           # desktop 전용: auto, cpu, cu118, cu126, cu128
jetson_torch: auto   # 기존 NVIDIA PyTorch 재사용, 없으면 NVIDIA wheel 자동 탐색
recreate: false      # true이면 선택한 가상환경을 삭제 후 재생성합니다.
dev: false           # true이면 pytest도 설치합니다.
