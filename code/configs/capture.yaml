# RGB-D/GPS/IMU 원시 이벤트 수집 설정입니다.
# 없는 장치 포트와 NTRIP 값은 코드 기본값 또는 NTRIP_* 환경변수를 사용합니다.
output_dir: ../data            # 타임스탬프별 *_raw 폴더가 만들어질 저장소 루트 데이터 폴더
fps: 15.0                      # RGB와 Depth에 요청할 기본 프레임률
depth_fps: 15                  # RGB와 같은 cadence로 요청해 인접 프레임 오매칭을 방지
rgb_width: 0                   # 0=연결된 색 카메라의 최대 해상도. 장치에서 늘리지 않으며 초해상화는 서버에서 수행
rgb_height: 0                  # 0=자동. RGB와 정렬 Depth는 같은 저장 크기 사용
depth_input_width: 0           # 0=좌우 공통 최대 입력 폭. RVC2는 최대 1280
depth_input_height: 0          # 0=좌우 공통 최대 입력 높이. 폭과 함께 지정
rgb_max_pixels: 0              # 0=기본 2304000화소 상한. RGB 자동 선택에만 적용
camera_stream_budget_mb_s: 0   # 0=USB SUPER/SUPER_PLUS 150 MB/s, 그 밖 30 MB/s. 자동 선택에만 적용
max_runtime_s: 0               # 최대 수집 시간(초). 0이면 Ctrl-C까지 계속 수집
exposure_settle_s: 3.0         # 카메라 시작 후 이 시간 동안 영상 프레임을 저장하지 않음(자동노출 수렴). IMU·GNSS는 계속 기록
monitor_only: false            # true면 데이터셋 없이 저대역폭 센서 상태/프리뷰만 계속 게시
controller_bridge_enabled: true # 앱용 센서 상태 JSON과 카메라 프리뷰 생성
controller_bridge_dir: /var/lib/jetson-sensors
controller_status_interval_s: 1.0
controller_sensor_stale_after_s: 3.0
controller_preview_fps: 15.0
controller_preview_max_width: 1920
controller_preview_jpeg_quality: 78
depth_alignment_mode: auto     # auto 권장: RVC2/3=StereoDepth, RVC4=ImageAlign
depth_preset: FAST_DENSITY     # 노면 깊이 밀도 우선(3.1.0: confidence 15, LR 10). FAST_ACCURACY는 55, 5
lr_check: true                 # 좌우 disparity 검사로 가림 경계의 잘못된 Depth 감소
subpixel: true                 # subpixel disparity로 원거리 Depth 정밀도 향상
subpixel_fractional_bits: 5    # 800P long-range 정확도 확인용. 이 경우 median filter는 비활성화
stereo_median_filter: "off"    # 정확도 검증 시 post-processing filter를 줄여 raw stereo 상태 확인
stereo_confidence_threshold: -1    # -1=프리셋 값. DepthAI v3는 값이 낮을수록 더 많은 픽셀을 남김
stereo_lr_check_threshold: -1      # -1=프리셋 값
stereo_speckle_filter: false       # 작은 오정합 덩어리 제거. 켜기 전 depth 15 FPS 유지 확인
stereo_speckle_range: 50
stereo_speckle_difference_threshold: 2
stereo_spatial_filter: false       # 가로 방향 작은 구멍 메움. 켜기 전 FPS 확인
stereo_spatial_hole_filling_radius: 2
stereo_spatial_alpha: 0.5
stereo_spatial_delta: 0            # 0=자동(정수 시차 3단계)
stereo_spatial_iterations: 1
stereo_postprocessing_shaves: 0    # 0=DepthAI 기본. 필터를 켠 뒤 FPS가 떨어지면 3/3
stereo_postprocessing_memory_slices: 0
stereo_ae_max_exposure_us: 0       # 0=기본(최대 약 프레임 시간). 흐린 날 주행이면 2000
stereo_ae_region: ""               # 저장 영상 기준 x0,y0,x1,y1(0~1). 비우면 화면 전체로 노출 측정
imu_rate: 200                  # Requested OAK IMU rate; monitor mode clamps to 100 Hz
imu_batch: 10
save_confidence_map: false     # Depth confidence PNG 저장. fragment 품질 게이트에 사용
rotate_180: false               # 장착 방향에 맞춰 RGB/Depth를 함께 180도 회전
enable_gps: true               # GPS/NMEA 및 NTRIP 보정 데이터 수집 여부
gps_device: auto               # u-blox /dev/serial/by-id 자동 선택 (Android ttyACM 포트 제외)
rtk_ntrip_auto_mountpoint: true # GPS 초기 위치 기준으로 가장 가까운 RTCM31 mountpoint 선택
rtk_ntrip_mountpoint_format: RTCM31
rtk_ntrip_mountpoint_candidates: "GANS-RTCM31,GUMC-RTCM31,DBON-RTCM31,PAJU-RTCM31,YONS-RTCM31,SOUL-RTCM31,INCH-RTCM31,ICOR-RTCM31,SONP-RTCM31,OJBU-RTCM31,PJMS-RTCM31,YANJ-RTCM31,DOND-RTCM31,NAMY-RTCM31,GANH-RTCM31,SWGS-RTCM31,SUWN-RTCM31,POCN-RTCM31,YANP-RTCM31,YEOJ-RTCM31"
rtk_ntrip_position_wait_s: 10.0 # 처음 연결 전 GPS 위치를 기다리는 시간
rtk_ntrip_data_timeout_s: 15.0  # RTCM 데이터가 이 시간 동안 없으면 다음 기준국으로 전환
rtk_ntrip_max_mountpoints: 12   # 거리순으로 한 사이클에 시도할 최대 기준국 수
rtk_ntrip_reselect_interval_s: 300.0       # 이동 중 5분마다 가장 가까운 기준국을 다시 확인
rtk_ntrip_switch_min_improvement_m: 1000.0 # 현재 기준국보다 최소 1km 가까울 때만 전환
rtk_ntrip_position_max_age_s: 30.0         # 30초 넘게 갱신되지 않은 좌표로는 전환하지 않음
