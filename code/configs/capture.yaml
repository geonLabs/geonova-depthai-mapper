# RGB-D/GPS/IMU 원시 이벤트 수집 설정입니다.
# 없는 장치 포트와 NTRIP 값은 코드 기본값 또는 NTRIP_* 환경변수를 사용합니다.
output_dir: ../data            # 타임스탬프별 *_raw 폴더가 만들어질 저장소 루트 데이터 폴더
fps: 30.0                      # 요청 RGB-D 프레임률(Hz). USB 대역폭/저장 속도를 고려
depth_fps: 30                  # 0이면 RGB fps와 동일. RGB 정렬 Depth 저장 cadence는 RGB fps에 제한될 수 있음
rgb_width: 0                   # 0이면 컬러 센서를 보고 1920x1200/1920x1080/1280x720 중 자동 선택
rgb_height: 0                  # 0이면 컬러 센서를 보고 자동 선택
max_runtime_s: 0               # 최대 수집 시간(초). 0이면 Ctrl-C까지 계속 수집
controller_bridge_enabled: true # 앱용 센서 상태 JSON과 카메라 프리뷰 생성
controller_bridge_dir: /var/lib/jetson-sensors
controller_status_interval_s: 1.0
controller_sensor_stale_after_s: 3.0
controller_preview_fps: 4.0
controller_preview_max_width: 1280
controller_preview_jpeg_quality: 78
depth_alignment_mode: auto     # auto 권장: RVC2/3=StereoDepth, RVC4=ImageAlign
depth_preset: FAST_ACCURACY    # RVC2 accuracy 우선 preset
lr_check: true                 # 좌우 disparity 검사로 가림 경계의 잘못된 Depth 감소
subpixel: true                 # subpixel disparity로 원거리 Depth 정밀도 향상
subpixel_fractional_bits: 5    # 800P long-range 정확도 확인용. 이 경우 median filter는 비활성화
stereo_median_filter: "off"    # 정확도 검증 시 post-processing filter를 줄여 raw stereo 상태 확인
save_confidence_map: false     # Depth confidence PNG 저장. fragment 품질 게이트에 사용
rotate_180: false               # 장착 방향에 맞춰 RGB/Depth를 함께 180도 회전
enable_gps: true               # GPS/NMEA 및 NTRIP 보정 데이터 수집 여부
rtk_ntrip_auto_mountpoint: true # GPS 초기 위치 기준으로 가장 가까운 RTCM31 mountpoint 선택
rtk_ntrip_mountpoint_format: RTCM31
rtk_ntrip_mountpoint_candidates: "GANS-RTCM31,GUMC-RTCM31,DBON-RTCM31,PAJU-RTCM31,YONS-RTCM31,SOUL-RTCM31,INCH-RTCM31,ICOR-RTCM31,SONP-RTCM31,OJBU-RTCM31,PJMS-RTCM31,YANJ-RTCM31,DOND-RTCM31,NAMY-RTCM31,GANH-RTCM31,SWGS-RTCM31,SUWN-RTCM31,POCN-RTCM31,YANP-RTCM31,YEOJ-RTCM31"
rtk_ntrip_position_wait_s: 10.0 # 처음 연결 전 GPS 위치를 기다리는 시간
rtk_ntrip_data_timeout_s: 15.0  # RTCM 데이터가 이 시간 동안 없으면 다음 기준국으로 전환
rtk_ntrip_max_mountpoints: 12   # 거리순으로 한 사이클에 시도할 최대 기준국 수
enable_external_imu: true      # 외부 EBIMU 자세 데이터 수집 여부
